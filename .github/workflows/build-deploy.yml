name: Build & Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# Serialize production deploys; never cancel an in-flight rollout.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # github.repository ("HedgeVaults/app") has uppercase chars GHCR rejects.
  IMAGE_NAME: hedgevaults/app
  DEPLOYMENT: app
  NAMESPACE: hedgevault-prod
  MANIFESTS: k8s
  NEXT_PUBLIC_CLUSTER: mainnet-beta

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      immutable-tag: ${{ steps.tag.outputs.immutable }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tags
        id: tag
        run: |
          echo "immutable=${GITHUB_SHA::12}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "moving=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_CLUSTER=${{ env.NEXT_PUBLIC_CLUSTER }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.immutable }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.moving }}
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint, test & build
        run: |
          yarn lint
          yarn test
          yarn build

  deploy:
    needs: [build, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          APP_HOST: ${{ vars.APP_HOST }}
        run: |
          if ! printf '%s' "$APP_HOST" | grep -Eq '^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$'; then
            echo "Set production environment variable APP_HOST to a valid DNS hostname." >&2
            exit 1
          fi

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      # ghcr-pull and app-secrets (RPC_URL and optional JUPITER_API_KEY) are
      # provisioned out-of-band. The workflow never creates or replaces them.
      - name: Apply manifests
        env:
          APP_HOST: ${{ vars.APP_HOST }}
          IMAGE_TAG: ${{ needs.build.outputs.immutable-tag }}
        run: |
          kubectl -n "$NAMESPACE" apply -f "$MANIFESTS/configmap.yaml"
          kubectl -n "$NAMESPACE" apply -f "$MANIFESTS/service.yaml"
          sed "s|__APP_HOST__|${APP_HOST}|g" "$MANIFESTS/ingress.yaml" \
            | kubectl -n "$NAMESPACE" apply -f -
          sed "s|__IMAGE_TAG__|${IMAGE_TAG}|g" "$MANIFESTS/deployment.yaml" \
            | kubectl -n "$NAMESPACE" apply -f -

      - name: Wait for rollout
        run: |
          kubectl -n "$NAMESPACE" rollout status \
            deployment/"$DEPLOYMENT" --timeout=10m
